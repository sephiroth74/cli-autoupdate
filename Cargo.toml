[package]
name = "cli-autoupdate"
version = "0.2.1"
edition = "2021"
license = "MIT"
authors = ["Alessandro Crugnola <alessandro.crugnola@swisscom.com>"]
repository = "https://github.com/sephiroth74/cli-autoupdate"
description = "Simple autoupdate library for checking/update binaries"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
progress = ["dep:indicatif"]

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
reqwest = { version = "0.12.22", features = ["json", "stream"] }
semver = "1.0.26"
serde = { version = "1.0.219", features = ["std", "derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["full"] }
url = "2.5.4"
tracing = "0.1.41"
futures-util = "0.3.31"
flate2 = "1.1.2"
tar = "0.4.44"
sha256 = "1.6.0"
indicatif = { version = "0.18.0", optional = true }
anyhow = "1.0.98"


[dev-dependencies]
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
logging-subscriber = "0.2.0"
tokio-test = "0.4.4"
console = "0.16.0"
indicatif = "0.18.0"
